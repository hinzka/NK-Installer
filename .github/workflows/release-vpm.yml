# NK Installer VPMパッケージ自動リリース用ワークフロー
#
# 【使い方】
#   1. リポジトリ内に vX.Y.Z 形式のタグ（例: v1.0.6）をプッシュすると自動的に起動します。
#      package.json の "version" フィールドと、タグの数字部分は必ず一致させてください。
#
#   2. パッケージフォルダ（com.hinzka.nkinstaller/）の中身をzip化し、
#      GitHub Releaseとして公開します。
#
#   3. index.json（VPMリポジトリ一覧）を最新の内容に更新します。
#
#   4. index.json と、Add to VCC ボタンのある index.html を
#      gh-pages ブランチへ公開します。
#
# 【事前準備】
#   - Settings > Pages で、Source を gh-pages branch に設定してください。
#   - Settings > Actions > General > Workflow permissions で、
#     "Read and write permissions" を有効にしてください。

name: Release VPM Package

on:
  push:
    tags:
      - "v*.*.*"

env:
  PACKAGE_NAME: com.hinzka.nkinstaller
  PACKAGE_DIR: com.hinzka.nkinstaller
  INDEX_JSON: index.json

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: タグからバージョン番号を取得
        id: version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: package.jsonのバージョンとタグが一致しているか確認
        run: |
          PKG_VERSION=$(python3 -c "import json; print(json.load(open('${PACKAGE_DIR}/package.json'))['version'])")

          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::package.json のバージョン($PKG_VERSION)とタグ(${{ steps.version.outputs.tag }})が一致していません。"
            exit 1
          fi

      - name: パッケージzipを作成
        run: |
          ZIP_NAME="${PACKAGE_NAME}-${{ steps.version.outputs.version }}.zip"

          # package.json がZIPのルート直下に来るよう、
          # パッケージフォルダの中へ移動してからZIP化する
          cd "$PACKAGE_DIR"
          zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" .
          cd "$GITHUB_WORKSPACE"

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: zipのSHA256を計算
        id: hash
        run: |
          HASH=$(sha256sum "$ZIP_NAME" | cut -d' ' -f1)
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"

      - name: GitHub Releaseを作成しzipを添付
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "NK Installer ${{ steps.version.outputs.version }}"
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true

      - name: index.jsonへ新バージョンを追記
        run: |
          python3 << 'PYEOF'
          import json
          import os

          pkg_dir = os.environ["PACKAGE_DIR"]
          version = "${{ steps.version.outputs.version }}"
          zip_name = os.environ["ZIP_NAME"]
          sha256 = "${{ steps.hash.outputs.sha256 }}"
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = "${{ steps.version.outputs.tag }}"

          # package.json を読み込む
          with open(f"{pkg_dir}/package.json", encoding="utf-8") as f:
              pkg = json.load(f)

          # Release ZIP URL
          pkg["url"] = (
              f"https://github.com/{repo}/releases/download/"
              f"{tag}/{zip_name}"
          )

          # ZIPのSHA256
          pkg["zipSHA256"] = sha256

          index_path = os.environ["INDEX_JSON"]

          # 既存のindex.jsonを読み込む
          if os.path.exists(index_path):
              with open(index_path, encoding="utf-8") as f:
                  index = json.load(f)
          else:
              index = {
                  "name": "hinzka's VPM Repository",
                  "id": "com.hinzka.vpm",
                  "author": "hinzka",
                  "packages": {}
              }

          owner, repository = repo.split("/", 1)

          # GitHub Pages上のindex.json URL
          index["url"] = (
              f"https://{owner}.github.io/"
              f"{repository}/{index_path}"
          )

          # パッケージ情報を追加
          packages = index.setdefault("packages", {})
          package_entry = packages.setdefault(pkg["name"], {})
          versions = package_entry.setdefault("versions", {})

          versions[version] = pkg

          # index.jsonを書き出す
          with open(index_path, "w", encoding="utf-8") as f:
              json.dump(
                  index,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")
          PYEOF

      - name: GitHub Pages公開用ファイルを作成
        run: |
          mkdir -p _site

          # VPM Repository
          cp "$INDEX_JSON" "_site/$INDEX_JSON"

          # GitHub Pages Landing Page
          cat > _site/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="ja">

          <head>
            <meta charset="UTF-8">
            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >

            <title>NK Installer</title>

            <style>
              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;

                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  "Noto Sans JP",
                  sans-serif;

                background: #f7f7fb;
                color: #292936;
              }

              .card {
                width: 100%;
                max-width: 620px;
                padding: 48px 36px;

                background: #ffffff;
                border-radius: 24px;

                box-shadow:
                  0 12px 40px rgba(0, 0, 0, 0.08);

                text-align: center;
              }

              h1 {
                margin: 0 0 12px;
                font-size: 36px;
              }

              .description {
                margin: 0 auto 32px;
                line-height: 1.8;
                color: #666674;
              }

              .vcc-button {
                display: inline-block;

                padding: 16px 32px;

                border-radius: 14px;

                background: #5856d6;
                color: #ffffff;

                text-decoration: none;

                font-size: 18px;
                font-weight: 700;

                transition:
                  transform 0.15s ease,
                  opacity 0.15s ease;
              }

              .vcc-button:hover {
                transform: translateY(-2px);
                opacity: 0.9;
              }

              .manual {
                margin-top: 36px;
                padding-top: 28px;

                border-top:
                  1px solid #e6e6ec;
              }

              .manual p {
                color: #666674;
                line-height: 1.7;
              }

              code {
                display: block;

                margin-top: 14px;
                padding: 14px;

                background: #f1f1f6;

                border-radius: 10px;

                word-break: break-all;

                font-size: 13px;

                user-select: all;
              }

              .small {
                margin-top: 26px;

                font-size: 13px;
                color: #9999a5;
              }
            </style>
          </head>

          <body>

            <main class="card">

              <h1>NK Installer</h1>

              <p class="description">
                VRChat向け NK Installer を<br>
                VRChat Creator Companion に追加できます。
              </p>

              <a
                class="vcc-button"
                href="vcc://vpm/addRepo?url=https%3A%2F%2Fhinzka.github.io%2FNK-Installer%2Findex.json"
              >
                Add to VCC
              </a>

              <div class="manual">

                <p>
                  ボタンが動作しない場合は、VCCの<br>
                  <strong>
                    Settings → Packages → Add Repository
                  </strong>
                  <br>
                  から以下のURLを追加してください。
                </p>

                <code>
                  https://hinzka.github.io/NK-Installer/index.json
                </code>

              </div>

              <p class="small">
                NK Installer by hinzka
              </p>

            </main>

          </body>

          </html>
          HTMLEOF

      - name: GitHub Pagesへ反映
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false